name: Build SA-MP Build69 Library (.so)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Android NDK
      uses: android-actions/setup-android@v3

    - name: Install NDK r17c
      run: |
        sdkmanager --install "ndk;17.2.4988734"

    # Solusi tuntas: Membuat symlink libtinfo.so.6 menjadi libtinfo.so.5 untuk NDK lawas
    - name: Fix libtinfo5 missing via Symlink
      run: |
        sudo apt-get update
        sudo apt-get install -y libtinfo6
        # Membuat tautan simbolik agar NDK membaca libtinfo6 sebagai libtinfo5
        sudo ln -s /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5
        sudo ln -s /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5

    # Menjalankan kompilasi terarah langsung ke folder jni bawaan build69
    - name: Build with ndk-build
      run: |
        $ANDROID_HOME/ndk/17.2.4988734/ndk-build -C ./jni NDK_PROJECT_PATH=../

    # Mengambil hasil akhir file .so yang berhasil dibuat
    - name: Upload Compiled .so Artifact
      uses: actions/upload-artifact@v4
      with:
        name: samp-build69-libs
        path: |
          libs/
          obj/local/
