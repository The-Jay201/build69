name: Build SA-MP Build69 Library (.so)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Android NDK
      uses: android-actions/setup-android@v3

    - name: Install NDK r16b / r17c (Wajib Versi Lama)
      run: |
        sdkmanager --install "ndk;17.2.4988734"

    # Compile langsung mengarah ke folder jni bawaan build69
    - name: Build with ndk-build
      run: |
        $ANDROID_HOME/ndk/17.2.4988734/ndk-build -C ./jni NDK_PROJECT_PATH=../

    - name: Upload Compiled .so Artifact
      uses: actions/upload-artifact@v4
      with:
        name: samp-build69-libs
        path: libs/
