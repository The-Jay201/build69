name: Build Android NDK Project

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Android NDK
      # Menggunakan versi yang lebih tua agar mendukung gnustl_static
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r16b 

    - name: Prepare and Compile
      run: |
        # 1. Cari file Application.mk dan ganti gnustl_static ke c++_static agar bisa compile di NDK modern
        # Jika file ada di jni/Application.mk
        if [ -f "jni/Application.mk" ]; then
          sed -i 's/gnustl_static/c++_static/g' jni/Application.mk
        fi
        
        # 2. Compile menggunakan ndk-build
        cd jni
        $ANDROID_NDK_HOME/ndk-build
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: output-libraries
        path: |
          libs/**/*.so
