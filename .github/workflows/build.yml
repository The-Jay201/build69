name: Build SA-MP CEF

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install MinGW and Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential mingw-w64 make cmake

    - name: Compile Project
      run: |
        # Menggunakan Makefile standar dengan cross-compiler MinGW 32-bit (untuk SA-MP Windows)
        make CC=i686-w64-mingw32-gcc CXX=i686-w64-mingw32-g++ AR=i686-w64-mingw32-ar

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: samp-cef-plugin
        path: |
          *.dll
          bin/*.dll
