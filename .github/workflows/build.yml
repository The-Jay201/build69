name: Build Android NDK Project

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository with Submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r16b 

    - name: Prepare and Compile
      run: |
        # Ganti gnustl_static ke c++_static jika file Application.mk ada
        if [ -f "jni/Application.mk" ]; then
          sed -i 's/gnustl_static/c++_static/g' jni/Application.mk
        fi
        
        # Jalankan ndk-build
        cd jni
        $ANDROID_NDK_HOME/ndk-build
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: output-libraries
        path: |
          libs/**/*.so
