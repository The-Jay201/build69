name: Build SA-MP Build69 Library (.so)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Android NDK
      uses: android-actions/setup-android@v3

    - name: Install NDK r17c
      run: |
        sdkmanager --install "ndk;17.2.4988734"

    - name: Fix libtinfo5 missing via Symlink (Force)
      run: |
        sudo apt-get update
        sudo apt-get install -y libtinfo6
        sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5
        sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5

    # Menangani case-sensitivity Linux untuk RakNet dan file header (.h) di folder jni
    - name: Fix Case Sensitivity Issues
      run: |
        cd jni
        # Fix RakNet folder casing
        if [ -d "vendor/raknet" ] && [ ! -d "vendor/RakNet" ]; then
          ln -s raknet vendor/RakNet
        fi
        
        # Fix CheckFileHash.h casing jika file aslinya huruf kecil
        if [ -f "checkfilehash.h" ] && [ ! -f "CheckFileHash.h" ]; then
          ln -s checkfilehash.h CheckFileHash.h
        fi
        ls -la

    # Menjalankan kompilasi terarah langsung ke folder jni bawaan build69
    - name: Build with ndk-build
      run: |
        $ANDROID_HOME/ndk/17.2.4988734/ndk-build -C ./jni NDK_PROJECT_PATH=../

    # Mengambil hasil akhir file .so yang berhasil dibuat
    - name: Upload Compiled .so Artifact
      uses: actions/upload-artifact@v4
      with:
        name: samp-build69-libs
        path: |
          libs/
          obj/local/
